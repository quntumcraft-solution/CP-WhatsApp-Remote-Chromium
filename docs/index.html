<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>CP Remote Chrome</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#top{
  background:#202124;
  padding:6px;
}

#url{
  width:100%;
  height:34px;
  background:#303134;
  color:#fff;
  border:1px solid #777;
  border-radius:4px;
  padding:5px 8px;
  font-size:13px;
}

#buttons{
  display:flex;
  gap:4px;
  margin-top:5px;
  flex-wrap:wrap;
}

button{
  background:#303134;
  color:#fff;
  border:1px solid #777;
  border-radius:4px;
  padding:6px 9px;
  font-size:12px;
}

button:focus{
  outline:2px solid #8ab4f8;
}

#start{
  background:#1a73e8;
}

#status{
  height:28px;
  padding:6px 7px;
  background:#181818;
  color:#aaa;
  font-size:10px;
  overflow:hidden;
  white-space:nowrap;
}

#screenBox{
  width:100%;
  height:calc(100vh - 112px);
  background:#000;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;
}

#screen{
  max-width:100%;
  max-height:100%;

  width:auto;
  height:auto;

  display:block;

  background:#fff;

  user-select:none;

  -webkit-user-drag:none;
}

</style>

</head>

<body>

<div id="top">

<input
  id="url"
  type="text"
  value="https://www.google.com/"
  placeholder="Enter website URL"
>

<div id="buttons">

<button
  id="start"
  onclick="startBrowser()"
>
START
</button>

<button onclick="openURL()">
GO
</button>

<button onclick="goBack()">
BACK
</button>

<button onclick="goForward()">
NEXT
</button>

<button onclick="reloadPage()">
RELOAD
</button>

</div>

</div>

<div id="status">
Remote Chromium offline
</div>

<div id="screenBox">

<img
  id="screen"
  src=""
  alt=""
>

</div>

<script>

const SERVER =
  "https://cp-whatsapp-remote-chromium.onrender.com";

const TOKEN =
  "cp-demo-2026";

const urlInput =
  document.getElementById("url");

const screen =
  document.getElementById("screen");

const statusBox =
  document.getElementById("status");

let running = false;

let refreshTimer = null;


// ================================
// START
// ================================

async function startBrowser(){

  try{

    statusBox.textContent =
      "Starting Remote Chromium...";

    const response =
      await fetch(
        SERVER +
        "/start?token=" +
        encodeURIComponent(TOKEN),
        {
          method:"GET",
          cache:"no-store"
        }
      );

    const text =
      await response.text();

    if(!response.ok){
      throw new Error(text);
    }

    const data =
      JSON.parse(text);

    if(data.success !== true){

      throw new Error(
        data.error ||
        "Browser start failed"
      );

    }

    running = true;

    statusBox.textContent =
      "Remote Chromium: ONLINE";

    startAutoRefresh();

    // Automatically open current URL
    await openURL();

  }

  catch(error){

    running = false;

    statusBox.textContent =
      "START ERROR: " +
      error.message;

  }

}


// ================================
// API
// ================================

async function api(
  path,
  method="GET",
  body=null
){

  const options = {

    method:method,

    headers:{
      "X-Access-Token":TOKEN
    },

    cache:"no-store"

  };

  if(body !== null){

    options.headers[
      "Content-Type"
    ] = "application/json";

    options.body =
      JSON.stringify(body);

  }

  const response =
    await fetch(
      SERVER + path,
      options
    );

  if(!response.ok){

    const text =
      await response.text();

    throw new Error(text);

  }

  return response;

}


// ================================
// OPEN URL
// ================================

async function openURL(){

  if(!running){

    await startBrowser();

    if(!running){
      return;
    }

    return;

  }

  let url =
    urlInput.value.trim();

  if(!url){

    url =
      "https://www.google.com/";

  }

  if(
    !/^https?:\/\//i.test(url)
  ){

    url =
      "https://" + url;

  }

  urlInput.value = url;

  try{

    statusBox.textContent =
      "Opening...";

    const response =
      await api(
        "/open",
        "POST",
        {
          url:url
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Open failed"
      );

    }

    statusBox.textContent =
      "Remote: " +
      data.url;

    await refreshScreen();

  }

  catch(error){

    statusBox.textContent =
      "OPEN ERROR: " +
      error.message;

  }

}


// ================================
// SCREENSHOT
// ================================

async function refreshScreen(){

  if(!running){
    return;
  }

  try{

    const response =
      await api("/screenshot");

    if(!response.ok){

      throw new Error(
        "Screenshot failed"
      );

    }

    const blob =
      await response.blob();

    const imageURL =
      URL.createObjectURL(blob);

    screen.onload = function(){

      URL.revokeObjectURL(
        imageURL
      );

    };

    screen.src =
      imageURL;

  }

  catch(error){

    statusBox.textContent =
      "SCREEN ERROR: " +
      error.message;

  }

}


// ================================
// AUTO REFRESH
// ================================

function startAutoRefresh(){

  if(refreshTimer !== null){
    return;
  }

  refreshTimer =
    setInterval(
      refreshScreen,
      2000
    );

}


// ================================
// BACK
// ================================

async function goBack(){

  if(!running){
    return;
  }

  try{

    statusBox.textContent =
      "Going back...";

    const response =
      await api(
        "/back",
        "POST"
      );

    const data =
      await response.json();

    statusBox.textContent =
      "Remote: " +
      data.url;

    setTimeout(
      refreshScreen,
      300
    );

  }

  catch(error){

    statusBox.textContent =
      "BACK ERROR: " +
      error.message;

  }

}


// ================================
// FORWARD
// ================================

async function goForward(){

  if(!running){
    return;
  }

  try{

    statusBox.textContent =
      "Going forward...";

    const response =
      await api(
        "/forward",
        "POST"
      );

    const data =
      await response.json();

    statusBox.textContent =
      "Remote: " +
      data.url;

    setTimeout(
      refreshScreen,
      300
    );

  }

  catch(error){

    statusBox.textContent =
      "NEXT ERROR: " +
      error.message;

  }

}


// ================================
// RELOAD
// ================================

async function reloadPage(){

  if(!running){
    return;
  }

  try{

    statusBox.textContent =
      "Reloading...";

    const response =
      await api(
        "/reload",
        "POST"
      );

    const data =
      await response.json();

    statusBox.textContent =
      "Remote: " +
      data.url;

    setTimeout(
      refreshScreen,
      500
    );

  }

  catch(error){

    statusBox.textContent =
      "RELOAD ERROR: " +
      error.message;

  }

}


// ================================
// SCREEN CLICK
// ================================

screen.addEventListener(
  "click",
  async function(event){

    if(!running){
      return;
    }

    const rect =
      screen.getBoundingClientRect();

    const width =
      screen.naturalWidth || 1280;

    const height =
      screen.naturalHeight || 720;

    if(
      rect.width <= 0 ||
      rect.height <= 0
    ){

      return;

    }

    const x =
      (
        event.clientX -
        rect.left
      ) *
      width /
      rect.width;

    const y =
      (
        event.clientY -
        rect.top
      ) *
      height /
      rect.height;

    try{

      await api(
        "/click",
        "POST",
        {
          x:Math.round(x),
          y:Math.round(y)
        }
      );

      setTimeout(
        refreshScreen,
        250
      );

    }

    catch(error){

      statusBox.textContent =
        "CLICK ERROR: " +
        error.message;

    }

  }
);


// ================================
// KEYBOARD
// ================================

document.addEventListener(
  "keydown",
  async function(event){

    if(
      document.activeElement ===
      urlInput
    ){

      if(event.key === "Enter"){

        event.preventDefault();

        openURL();

      }

      return;

    }

    if(!running){
      return;
    }

    const key =
      event.key;

    try{

      await api(
        "/key",
        "POST",
        {
          key:key
        }
      );

      setTimeout(
        refreshScreen,
        200
      );

    }

    catch(error){

      statusBox.textContent =
        "KEY ERROR: " +
        error.message;

    }

  }
);


// ================================
// URL ENTER
// ================================

urlInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      openURL();

    }

  }
);


// ================================
// NUMBER SHORTCUTS
// ================================

document.addEventListener(
  "keydown",
  function(event){

    if(
      document.activeElement ===
      urlInput
    ){

      return;

    }

    if(event.key === "1"){

      urlInput.value =
        "https://www.google.com/";

      openURL();

    }

    else if(event.key === "2"){

      urlInput.value =
        "https://www.youtube.com/";

      openURL();

    }

    else if(event.key === "3"){

      urlInput.value =
        "https://web.whatsapp.com/";

      openURL();

    }

    else if(event.key === "4"){

      urlInput.value =
        "https://www.facebook.com/";

      openURL();

    }

  }
);

</script>

</body>

</html>
