<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>CP Powerful Browser</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#top{
  background:#202124;
  padding:4px;
}

#url{
  width:100%;
  height:30px;
  background:#303134;
  color:#fff;
  border:1px solid #777;
  border-radius:4px;
  padding:4px 6px;
  font-size:12px;
}

#buttons{
  display:flex;
  gap:3px;
  margin-top:4px;
  flex-wrap:wrap;
}

button{
  background:#303134;
  color:#fff;
  border:1px solid #777;
  border-radius:3px;
  padding:5px 7px;
  font-size:11px;
}

button:focus{
  outline:2px solid #8ab4f8;
}

#start{
  background:#1a73e8;
}

#status{
  height:25px;
  padding:5px;
  background:#181818;
  color:#aaa;
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
}

#screenBox{
  width:100%;
  height:calc(100vh - 98px);
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

#screen{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  display:block;
  background:#fff;
  user-select:none;
  -webkit-user-drag:none;
}

#menu{
  position:absolute;
  left:4px;
  right:4px;
  bottom:4px;
  background:#202124;
  border:1px solid #777;
  padding:5px;
  display:none;
  z-index:20;
}

.menuItem{
  padding:6px;
  border-bottom:1px solid #444;
  font-size:11px;
}

.menuItem:last-child{
  border-bottom:none;
}

.menuSelected{
  background:#1a73e8;
}

</style>

</head>

<body>

<div id="top">

<input
  id="url"
  type="text"
  value="https://www.google.com/"
  placeholder="URL / Search"
>

<div id="buttons">

<button id="start">
START
</button>

<button id="go">
GO
</button>

<button id="back">
BACK
</button>

<button id="forward">
NEXT
</button>

<button id="reload">
RELOAD
</button>

<button id="zoomIn">
ZOOM+
</button>

<button id="zoomOut">
ZOOM-
</button>

</div>

</div>

<div id="status">
Remote Chromium offline
</div>

<div id="screenBox">

<img
  id="screen"
  src=""
  alt=""
>

</div>

<div id="menu">

<div
  class="menuItem"
  data-action="google"
>
1. Google
</div>

<div
  class="menuItem"
  data-action="youtube"
>
2. YouTube
</div>

<div
  class="menuItem"
  data-action="whatsapp"
>
3. WhatsApp
</div>

<div
  class="menuItem"
  data-action="zoomreset"
>
4. Reset Zoom
</div>

<div
  class="menuItem"
  data-action="close"
>
5. Close Menu
</div>

</div>

<script>

const SERVER =
  "https://cp-whatsapp-remote-chromium.onrender.com";

const TOKEN =
  "cp-demo-2026";

const urlInput =
  document.getElementById("url");

const screen =
  document.getElementById("screen");

const statusBox =
  document.getElementById("status");

const menu =
  document.getElementById("menu");

const menuItems =
  document.querySelectorAll(".menuItem");

let running = false;

let refreshTimer = null;

let menuOpen = false;

let menuIndex = 0;


// =================================
// API
// =================================

async function api(
  path,
  method="GET",
  body=null
){

  const options = {

    method:method,

    headers:{
      "X-Access-Token":TOKEN
    },

    cache:"no-store"

  };

  if(body !== null){

    options.headers[
      "Content-Type"
    ] = "application/json";

    options.body =
      JSON.stringify(body);

  }

  const response =
    await fetch(
      SERVER + path,
      options
    );

  if(!response.ok){

    const text =
      await response.text();

    throw new Error(text);

  }

  return response;

}


// =================================
// START
// =================================

async function startBrowser(){

  if(running){
    return;
  }

  try{

    statusBox.textContent =
      "Starting Chromium...";

    const response =
      await fetch(
        SERVER +
        "/start?token=" +
        encodeURIComponent(TOKEN),
        {
          method:"GET",
          cache:"no-store"
        }
      );

    const text =
      await response.text();

    if(!response.ok){
      throw new Error(text);
    }

    const data =
      JSON.parse(text);

    if(data.success !== true){

      throw new Error(
        data.error ||
        "Browser start failed"
      );

    }

    running = true;

    statusBox.textContent =
      "Chromium ONLINE";

    startAutoRefresh();

    await openURL();

  }

  catch(error){

    running = false;

    statusBox.textContent =
      "START ERROR: " +
      error.message;

  }

}


// =================================
// OPEN
// =================================

async function openURL(){

  if(!running){

    await startBrowser();

    return;

  }

  let url =
    urlInput.value.trim();

  if(!url){

    url =
      "https://www.google.com/";

  }

  if(
    !/^https?:\/\//i.test(url)
  ){

    url =
      "https://" + url;

  }

  urlInput.value = url;

  try{

    statusBox.textContent =
      "Opening...";

    const response =
      await api(
        "/open",
        "POST",
        {
          url:url
        }
      );

    const data =
      await response.json();

    statusBox.textContent =
      "Remote: " +
      data.url;

    await refreshScreen();

  }

  catch(error){

    statusBox.textContent =
      "OPEN ERROR: " +
      error.message;

  }

}


// =================================
// SCREENSHOT
// =================================

async function refreshScreen(){

  if(!running){
    return;
  }

  try{

    const response =
      await api("/screenshot");

    const blob =
      await response.blob();

    const imageURL =
      URL.createObjectURL(blob);

    screen.onload =
      function(){

        URL.revokeObjectURL(
          imageURL
        );

      };

    screen.src =
      imageURL;

  }

  catch(error){

    statusBox.textContent =
      "SCREEN ERROR";

  }

}


// =================================
// AUTO REFRESH
// =================================

function startAutoRefresh(){

  if(refreshTimer !== null){
    return;
  }

  refreshTimer =
    setInterval(
      refreshScreen,
      2000
    );

}


// =================================
// BACK
// =================================

async function goBack(){

  if(!running){
    return;
  }

  try{

    const response =
      await api(
        "/back",
        "POST"
      );

    const data =
      await response.json();

    statusBox.textContent =
      "Remote: " +
      data.url;

    setTimeout(
      refreshScreen,
      300
    );

  }

  catch(error){

    statusBox.textContent =
      "BACK ERROR";

  }

}


// =================================
// FORWARD
// =================================

async function goForward(){

  if(!running){
    return;
  }

  try{

    const response =
      await api(
        "/forward",
        "POST"
      );

    const data =
      await response.json();

    statusBox.textContent =
      "Remote: " +
      data.url;

    setTimeout(
      refreshScreen,
      300
    );

  }

  catch(error){

    statusBox.textContent =
      "NEXT ERROR";

  }

}


// =================================
// RELOAD
// =================================

async function reloadPage(){

  if(!running){
    return;
  }

  try{

    statusBox.textContent =
      "Reloading...";

    await api(
      "/reload",
      "POST"
    );

    setTimeout(
      refreshScreen,
      500
    );

  }

  catch(error){

    statusBox.textContent =
      "RELOAD ERROR";

  }

}


// =================================
// ZOOM IN
// =================================

async function zoomIn(){

  if(!running){
    return;
  }

  try{

    await api(
      "/zoom",
      "POST",
      {
        amount:0.15
      }
    );

    setTimeout(
      refreshScreen,
      300
    );

  }

  catch(error){

    statusBox.textContent =
      "ZOOM ERROR";

  }

}


// =================================
// ZOOM OUT
// =================================

async function zoomOut(){

  if(!running){
    return;
  }

  try{

    await api(
      "/zoom",
      "POST",
      {
        amount:-0.15
      }
    );

    setTimeout(
      refreshScreen,
      300
    );

  }

  catch(error){

    statusBox.textContent =
      "ZOOM ERROR";

  }

}


// =================================
// RESET ZOOM
// =================================

async function resetZoom(){

  if(!running){
    return;
  }

  try{

    await api(
      "/zoom/reset",
      "POST"
    );

    setTimeout(
      refreshScreen,
      300
    );

  }

  catch(error){

    statusBox.textContent =
      "ZOOM ERROR";

  }

}


// =================================
// CLICK SCREEN
// =================================

screen.addEventListener(
  "click",
  async function(event){

    if(!running){
      return;
    }

    const rect =
      screen.getBoundingClientRect();

    const width =
      screen.naturalWidth || 1280;

    const height =
      screen.naturalHeight || 720;

    if(
      rect.width <= 0 ||
      rect.height <= 0
    ){
      return;
    }

    const x =
      (
        event.clientX -
        rect.left
      ) *
      width /
      rect.width;

    const y =
      (
        event.clientY -
        rect.top
      ) *
      height /
      rect.height;

    try{

      await api(
        "/click",
        "POST",
        {
          x:Math.round(x),
          y:Math.round(y)
        }
      );

      setTimeout(
        refreshScreen,
        250
      );

    }

    catch(error){

      statusBox.textContent =
        "CLICK ERROR";

    }

  }
);


// =================================
// KEYBOARD
// =================================

document.addEventListener(
  "keydown",
  async function(event){

    // URL field
    if(
      document.activeElement ===
      urlInput
    ){

      if(event.key === "Enter"){

        event.preventDefault();

        await openURL();

      }

      return;

    }

    // MENU
    if(menuOpen){

      if(event.key === "ArrowDown"){

        event.preventDefault();

        menuIndex++;

        if(
          menuIndex >=
          menuItems.length
        ){

          menuIndex = 0;

        }

        updateMenu();

        return;

      }

      if(event.key === "ArrowUp"){

        event.preventDefault();

        menuIndex--;

        if(menuIndex < 0){

          menuIndex =
            menuItems.length - 1;

        }

        updateMenu();

        return;

      }

      if(event.key === "Enter"){

        event.preventDefault();

        selectMenu();

        return;

      }

      if(
        event.key === "Escape" ||
        event.key === "#"
      ){

        event.preventDefault();

        closeMenu();

        return;

      }

    }

    if(!running){
      return;
    }

    // MENU
    if(
      event.key === "*" ||
      event.key === "m" ||
      event.key === "M"
    ){

      event.preventDefault();

      toggleMenu();

      return;

    }

    // Zoom +
    if(
      event.key === "+"
    ){

      event.preventDefault();

      await zoomIn();

      return;

    }

    // Zoom -
    if(
      event.key === "-"
    ){

      event.preventDefault();

      await zoomOut();

      return;

    }

    // Scroll up
    if(
      event.key === "ArrowUp"
    ){

      event.preventDefault();

      await api(
        "/scroll",
        "POST",
        {
          amount:-450
        }
      );

      setTimeout(
        refreshScreen,
        200
      );

      return;

    }

    // Scroll down
    if(
      event.key === "ArrowDown"
    ){

      event.preventDefault();

      await api(
        "/scroll",
        "POST",
        {
          amount:450
        }
      );

      setTimeout(
        refreshScreen,
        200
      );

      return;

    }

    // Left
    if(
      event.key === "ArrowLeft"
    ){

      event.preventDefault();

      await goBack();

      return;

    }

    // Right
    if(
      event.key === "ArrowRight"
    ){

      event.preventDefault();

      await goForward();

      return;

    }

    // RSK style Escape
    if(
      event.key === "Escape"
    ){

      event.preventDefault();

      return;

    }

    // Other keys
    try{

      await api(
        "/key",
        "POST",
        {
          key:event.key
        }
      );

      setTimeout(
        refreshScreen,
        200
      );

    }

    catch(error){

      statusBox.textContent =
        "KEY ERROR";

    }

  }
);


// =================================
// MENU
// =================================

function toggleMenu(){

  menuOpen =
    !menuOpen;

  menu.style.display =
    menuOpen
      ? "block"
      : "none";

  menuIndex = 0;

  updateMenu();

}


function closeMenu(){

  menuOpen = false;

  menu.style.display =
    "none";

}


function updateMenu(){

  menuItems.forEach(
    (item,index) => {

      item.classList.toggle(
        "menuSelected",
        index === menuIndex
      );

    }
  );

}


async function selectMenu(){

  const action =
    menuItems[
      menuIndex
    ].dataset.action;

  if(action === "google"){

    urlInput.value =
      "https://www.google.com/";

    closeMenu();

    await openURL();

  }

  else if(action === "youtube"){

    urlInput.value =
      "https://www.youtube.com/";

    closeMenu();

    await openURL();

  }

  else if(action === "whatsapp"){

    urlInput.value =
      "https://web.whatsapp.com/";

    closeMenu();

    await openURL();

  }

  else if(action === "zoomreset"){

    closeMenu();

    await resetZoom();

  }

  else if(action === "close"){

    closeMenu();

  }

}


// =================================
// BUTTONS
// =================================

document
  .getElementById("start")
  .onclick =
  startBrowser;

document
  .getElementById("go")
  .onclick =
  openURL;

document
  .getElementById("back")
  .onclick =
  goBack;

document
  .getElementById("forward")
  .onclick =
  goForward;

document
  .getElementById("reload")
  .onclick =
  reloadPage;

document
  .getElementById("zoomIn")
  .onclick =
  zoomIn;

document
  .getElementById("zoomOut")
  .onclick =
  zoomOut;


// =================================
// MENU CLICK
// =================================

menuItems.forEach(
  (item,index) => {

    item.addEventListener(
      "click",
      async function(){

        menuIndex = index;

        await selectMenu();

      }
    );

  }
);

</script>

</body>

</html>
